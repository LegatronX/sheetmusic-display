<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=3.0">
  <title>Partition Piano</title>
  <script src="https://unpkg.com/opensheetmusicdisplay@1.0.18/build/opensheetmusicdisplay.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      background: #16213e;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    
    h1 {
      font-size: 1.1rem;
      color: #e2b96f;
      flex: 1;
    }
    
    select, button {
      background: #0f3460;
      color: #fff;
      border: 1px solid #e2b96f;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      -webkit-appearance: none;
    }
    
    button:active { background: #e2b96f; color: #1a1a2e; }
    
    .controls {
      background: #16213e;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }
    
    .controls label {
      font-size: 0.8rem;
      color: #aaa;
    }
    
    input[type="range"] {
      -webkit-appearance: none;
      width: 100px;
      height: 4px;
      background: #0f3460;
      border-radius: 2px;
      outline: none;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #e2b96f;
      border-radius: 50%;
      cursor: pointer;
    }
    
    #score-container {
      flex: 1;
      overflow: auto;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }
    
    #osmd-container {
      width: 100%;
      min-height: 500px;
    }
    
    #loading {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 1.2rem;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #0f3460;
      border-top: 4px solid #e2b96f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .toggle-btn {
      padding: 6px 10px;
      font-size: 0.75rem;
    }
    
    .toggle-btn.active {
      background: #e2b96f;
      color: #1a1a2e;
    }
    
    #cursor-info {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #16213e;
      border: 1px solid #e2b96f;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.8rem;
      color: #e2b96f;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 200;
    }
    
    #cursor-info.show { opacity: 1; }
    
    /* OSMD cursor highlight color */
    .osmd-note-highlight { fill: #e2b96f !important; }
  </style>
</head>
<body>

<header>
  <h1 id="title">🎹 Partition Piano</h1>
  <select id="piece-select" onchange="loadPiece(this.value)">
    <option value="">— Choisir une partition —</option>
    <option value="fur_elise">Beethoven — Für Elise</option>
    <option value="sonatina_clementi">Clementi — Sonatine Op.36 No.1</option>
    <option value="mozart_sonata16">Mozart — Sonate K.545 (1er mvt)</option>
  </select>
</header>

<div class="controls">
  <button class="toggle-btn" onclick="toggleAutoScroll()" id="auto-scroll-btn">Auto-scroll</button>
  
  <label>Zoom</label>
  <input type="range" id="zoom-slider" min="30" max="200" value="80" oninput="setZoom(this.value)">
  
  <label>Taille notes</label>
  <input type="range" id="note-size" min="50" max="200" value="100" oninput="setNoteSize(this.value)">
  
  <label>Transposition</label>
  <input type="range" id="transpose" min="-6" max="6" value="0" oninput="setTranspose(this.value)">
  
  <button class="toggle-btn" onclick="toggleFollowCursor()" id="cursor-btn">Curseur</button>
  
  <button onclick="resetView()">↺ Reset</button>
</div>

<div id="score-container">
  <div id="loading">
    <div class="spinner"></div>
    Chargement...
  </div>
  <div id="osmd-container"></div>
</div>

<div id="cursor-info" id="cursor-info">-mesure</div>

<script>
  let osmd = null;
  let autoScrollInterval = null;
  let cursorFollow = false;
  let scrollPos = 0;
  let autoScrollEnabled = false;
  
  const pieces = {
    fur_elise: {
      title: 'Beethoven — Für Elise',
      url: 'https://raw.githubusercontent.com/christian-rolando/sheetmusic-display/main/fur_elise.musicxml'
    },
    sonatina_clementi: {
      title: 'Clementi — Sonatine Op.36 No.1',
      url: 'https://raw.githubusercontent.com/christian-rolando/sheetmusic-display/main/sonatina_clementi.musicxml'
    },
    mozart_sonata16: {
      title: 'Mozart — Sonate K.545 (1er mvt)',
      url: 'https://raw.githubusercontent.com/christian-rolando/sheetmusic-display/main/mozart_sonata16.musicxml'
    }
  };

  async function loadPiece(key) {
    if (!key) return;
    const piece = pieces[key];
    document.getElementById('title').textContent = '🎹 ' + piece.title;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('osmd-container').innerHTML = '';
    
    if (!osmd) {
      osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('#osmd-container', {
        autoResize: true,
        backendType: 'svg',
        drawTitle: true,
        drawComposer: true,
        drawMetronome: false,
        drawPartNames: false,
        drawMeasureNumbers: true,
        drawMeasureNumbersOnlyAtSystemStart: false,
        coloring: {
          enable: true,
          mode: opensheetmusicdisplay.OSMD.ColorMode.Custom,
          customColorSettings: {
            highlight: '#e2b96f',
            Cursor: '#e2b96f'
          }
        }
      });
    }
    
    try {
      await osmd.load(piece.url);
      osmd.render();
      
      // Apply current zoom
      setZoom(document.getElementById('zoom-slider').value);
      
      // Cursor
      osmd.cursor.show();
      osmd.cursor.setColor('#e2b96f');
      
      // Follow cursor callback
      osmd.cursor.next();
      
      document.getElementById('loading').style.display = 'none';
      
    } catch(e) {
      document.getElementById('loading').innerHTML = '<p style="color:#e74c3c">Erreur: ' + e.message + '</p>';
    }
  }
  
  function setZoom(val) {
    if (!osmd) return;
    const zoom = val / 100;
    osmd.setOptions({ zoom: zoom });
    osmd.render();
  }
  
  function setNoteSize(val) {
    if (!osmd) return;
    osmd.setOptions({ defaultFontSize: val });
    osmd.render();
  }
  
  function setTranspose(val) {
    if (!osmd) return;
    osmd.setOptions({ transposition: parseInt(val) });
    osmd.render();
  }
  
  function toggleAutoScroll() {
    autoScrollEnabled = !autoScrollEnabled;
    const btn = document.getElementById('auto-scroll-btn');
    btn.classList.toggle('active', autoScrollEnabled);
    
    if (autoScrollEnabled) {
      const container = document.getElementById('score-container');
      autoScrollInterval = setInterval(() => {
        scrollPos += 1;
        container.scrollTop = scrollPos;
      }, 50);
    } else {
      clearInterval(autoScrollInterval);
    }
  }
  
  function toggleFollowCursor() {
    cursorFollow = !cursorFollow;
    const btn = document.getElementById('cursor-btn');
    btn.classList.toggle('active', cursorFollow);
    
    if (!osmd) return;
    
    if (cursorFollow) {
      osmd.cursor.next();
      
      const info = document.getElementById('cursor-info');
      const container = document.getElementById('score-container');
      
      setInterval(() => {
        if (!osmd.cursor) return;
        osmd.cursor.next();
        
        // Get current measure
        const el = osmd.cursor.graphic;
        if (el && container) {
          container.scrollTop = el.parentElement ? 
            el.parentElement.offsetTop - 200 : 0;
          
          const measure = osmd.cursor.measureNumber || '';
          info.textContent = 'Mesure ' + measure;
          info.classList.add('show');
          setTimeout(() => info.classList.remove('show'), 2000);
        }
      }, 2000);
    }
  }
  
  function resetView() {
    const container = document.getElementById('score-container');
    container.scrollTop = 0;
    scrollPos = 0;
    document.getElementById('zoom-slider').value = 80;
    document.getElementById('note-size').value = 100;
    if (osmd) {
      setZoom(80);
      osmd.cursor.reset();
    }
  }
  
  // Touch/pan support
  const container = document.getElementById('score-container');
  let touchStartY = 0;
  
  container.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
  }, {passive: true});
  
  container.addEventListener('touchmove', e => {
    const delta = touchStartY - e.touches[0].clientY;
    scrollPos = container.scrollTop + delta;
    touchStartY = e.touches[0].clientY;
  }, {passive: true});
</script>

</body>
</html>
