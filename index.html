<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Partition Piano</title>
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@0.9.5/build/opensheetmusicdisplay.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #eee; font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #16213e; padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #0f3460; }
    h1 { font-size: 1rem; color: #e2b96f; flex: 1; }
    select, button { background: #0f3460; color: #fff; border: 1px solid #e2b96f; border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; cursor: pointer; }
    button.b-active { background: #e2b96f; color: #1a1a2e; }
    #toolbar { background: #16213e; padding: 8px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #0f3460; }
    .toolbar-label { font-size: 0.75rem; color: #888; }
    input[type=range] { width: 80px; }
    #score { flex: 1; overflow: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
    #loading { text-align: center; padding: 30px; color: #888; }
    #loading.hidden { display: none; }
    #cursor-btn.b-active { background: #e2b96f; color: #1a1a2e; }
    #auto-btn.b-active { background: #e2b96f; color: #1a1a2e; }
  </style>
</head>
<body>
<header>
  <h1 id="score-title">Partition Piano</h1>
  <select id="piece-select" onchange="loadPiece(this.value)">
    <option value="">— Choisir —</option>
    <option value="fur">Beethoven — F&#252;r Elise</option>
    <option value="sonatina">Clementi — Sonatine Op.36</option>
    <option value="mozart">Mozart — Sonate K.545</option>
  </select>
</header>
<div id="toolbar">
  <button id="auto-btn" onclick="toggleAutoScroll()">Auto-scroll</button>
  <span class="toolbar-label">Zoom</span><input type="range" id="zoom" min="30" max="200" value="70" oninput="applyZoom()">
  <span class="toolbar-label">Notes</span><input type="range" id="noteSize" min="50" max="200" value="100" oninput="applyNoteSize()">
  <span class="toolbar-label">Transp.</span><input type="range" id="transpose" min="-6" max="6" value="0" oninput="applyTranspose()">
  <button id="cursor-btn" onclick="toggleFollowCursor()">Curseur</button>
</div>
<div id="score">
  <div id="loading">Chargement...</div>
  <div id="osmd"></div>
</div>
<script>
var osmd = null;
var autoScrollTimer = null;
var cursorTimer = null;
var followCursor = false;
var autoScrollOn = false;

const pieces = {
  fur: { title: 'Beethoven — F&#252;r Elise', url: '/fur_elise.musicxml' },
  sonatina: { title: 'Clementi — Sonatine Op.36 No.1', url: '/sonatina_clementi.musicxml' },
  mozart: { title: 'Mozart — Sonate K.545 (1er mvt)', url: '/mozart_sonata16.musicxml' }
};

function loadPiece(key) {
  if (!key || !pieces[key]) return;
  var piece = pieces[key];
  document.getElementById('score-title').textContent = piece.title;
  var loading = document.getElementById('loading');
  loading.style.display = 'block';
  loading.textContent = 'Chargement de ' + piece.title + '...';

  if (osmd === null) {
    osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(document.getElementById('osmd'));
    osmd.setOptions({ autoResize: true, drawTitle: true, drawComposer: true, drawMeasureNumbers: true });
  }

  fetch(piece.url)
    .then(function(resp) { if (!resp.ok) throw new Error('HTTP ' + resp.status); return resp.text(); })
    .then(function(xml) {
      return osmd.load(xml);
    })
    .then(function() {
      osmd.render();
      applyZoom();
      osmd.cursor.show();
      osmd.cursor.setColor('#e2b96f');
      loading.style.display = 'none';
    })
    .catch(function(err) {
      loading.textContent = 'Erreur: ' + err.message;
      console.error(err);
    });
}

function applyZoom() {
  if (!osmd) return;
  var val = parseInt(document.getElementById('zoom').value);
  osmd.setOptions({ zoom: val / 100 });
  osmd.render();
}

function applyNoteSize() {
  if (!osmd) return;
  var val = parseInt(document.getElementById('noteSize').value);
  osmd.setOptions({ defaultFontSize: val });
  osmd.render();
}

function applyTranspose() {
  if (!osmd) return;
  var val = parseInt(document.getElementById('transpose').value);
  osmd.setOptions({ transposition: val });
  osmd.render();
}

function toggleAutoScroll() {
  autoScrollOn = !autoScrollOn;
  var btn = document.getElementById('auto-btn');
  if (autoScrollOn) {
    btn.classList.add('b-active');
    if (osmd && osmd.cursor) {
      autoScrollTimer = setInterval(function() {
        osmd.cursor.next();
        var el = osmd.cursor.graphic;
        if (el) {
          var score = document.getElementById('score');
          var rect = el.getBoundingClientRect ? el.getBoundingClientRect() : null;
          if (rect && rect.top < 100) {
            score.scrollTop += 2;
          }
        }
      }, 2500);
    }
  } else {
    btn.classList.remove('b-active');
    clearInterval(autoScrollTimer);
  }
}

function toggleFollowCursor() {
  followCursor = !followCursor;
  var btn = document.getElementById('cursor-btn');
  if (followCursor) {
    btn.classList.add('b-active');
    if (osmd && osmd.cursor) {
      cursorTimer = setInterval(function() {
        osmd.cursor.next();
        var el = osmd.cursor.graphic;
        if (el) {
          var score = document.getElementById('score');
          var rect = el.getBoundingClientRect ? el.getBoundingClientRect() : null;
          if (rect) {
            var containerTop = score.getBoundingClientRect().top;
            if (rect.top < containerTop + 80) {
              score.scrollTop += rect.top - containerTop - 80;
            }
          }
        }
      }, 2000);
    }
  } else {
    btn.classList.remove('b-active');
    clearInterval(cursorTimer);
  }
}
</script>
</body>
</html>
